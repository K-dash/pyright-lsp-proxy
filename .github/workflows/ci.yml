name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  pull_request:
    paths-ignore:
      - "*.md"

# Dedupe superseded runs. Group by PR number (not head_ref: branch names are
# not unique across forks, so two PRs from different forks with the same
# branch name would otherwise share a group and cancel each other). Repeated
# pushes to the same PR share a group, so the newer run cancels the older one.
# For push events to main, there is no pull_request number, so the group
# falls back to the unique run_id — every main commit gets its own group and
# never cancels another main run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Deny by default; each job below opts into the minimum it needs.
permissions: {}

jobs:
  ci:
    name: Makefile CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      # Let every platform leg finish even if another one fails, so a
      # platform-specific failure doesn't hide the other two platforms' results.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Step timeout (25) is lower than the job timeout (30) on purpose: a
      # step timeout marks the step as failed, so the `if: failure()` upload
      # below still runs. A job-level timeout instead cancels the job, and
      # `if: failure()` steps do not run on cancellation.
      - name: Run Makefile CI
        timeout-minutes: 25
        run: make ci 2>&1 | tee ci-output.log

      # Uploads only on failure (assertion failures and the step timeout
      # above), never on success or on cancellation from `concurrency`.
      # `if-no-files-found: warn` keeps a missing log from masking whatever
      # step actually failed.
      - name: Upload CI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-diagnostics-${{ matrix.os }}
          path: ci-output.log
          if-no-files-found: warn
          retention-days: 3

  zizmor:
    name: zizmor (Actions security)
    runs-on: ubuntu-latest # zizmor-action runs in a container; needs Docker
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          persona: regular
          # Public repo, no Advanced Security tier needed: print findings to
          # the log and fail the job on any finding instead of uploading SARIF.
          advanced-security: false

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Checks advisories, licenses, bans, and sources against deny.toml.
      # No separate Rust toolchain setup: the action's container bundles one.
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20

  msrv:
    name: MSRV (declared in Cargo.toml)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Cargo.toml's `rust-version` is the only source of truth for the MSRV.
      # Reading it here (instead of hardcoding the version in this workflow)
      # means there is nothing for a dependency bot to update independently
      # of that declaration — see renovate.json's packageRules entry that
      # disables updates to this job's toolchain dependency for the same
      # reason.
      - name: Read MSRV
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      # `master`, not `stable`: passing an explicit `toolchain` input
      # requires `master` per dtolnay/rust-toolchain's own docs (`stable`
      # only carries the "always latest stable" default this input overrides).
      - name: Setup declared MSRV
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # Guards the declared `rust-version` in Cargo.toml: without this, only
      # the latest stable toolchain (via the `ci` job) is ever exercised, so
      # a transitive dependency bump can silently raise the real minimum
      # supported Rust version past what's declared.
      - name: Check MSRV
        run: cargo check --workspace --all-targets --locked

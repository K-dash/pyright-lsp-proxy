name: Release

# Releases are atomic: validate -> build all platforms -> publish once.
# `publish` needs the full `build` matrix, and a `needs:` dependency on a
# matrix job is only satisfied when every leg succeeds. So if any platform
# build fails, `publish` never runs and no GitHub Release is created —
# there is no window where a Release exists with missing or partial assets.
#
# Two triggers feed this workflow:
#   - push to main: the automated path. When a version-bump PR merges,
#     `preflight` tags that commit itself, in this same run.
#   - push of a "v*" tag: the manual/emergency path, for when the
#     automation needs to be bypassed.
#
# A tag created with the default GITHUB_TOKEN does not itself trigger a new
# workflow run — GitHub suppresses events generated by GITHUB_TOKEN to
# prevent recursive runs. So the automated path can't "push a tag and let
# the `v*` trigger above fire the build"; tag creation and the
# validate/build/publish pipeline have to happen in one run, which is why
# `preflight` runs first regardless of which trigger fired and the
# downstream jobs key off its outputs instead of the triggering ref.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Serializes runs that target the same commit. This matters when a manual
# tag push (emergency path) races the automated main-push path for the same
# version-bump commit: the second run to start waits for the first to
# finish, then its `preflight` guard sees the release already exists and
# no-ops instead of building a duplicate.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

# Deny by default; each job below opts into the minimum it needs.
permissions: {}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used when creating a tag on the main-push path
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.guard.outputs.should_release }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # On a tag push, the incoming tag is the release target: validated
      # below like before. On a main push there is no incoming tag yet, so
      # the target is derived straight from Cargo.toml — the check below
      # still cross-checks Cargo.lock, plugin.json, and marketplace.json
      # against it, so an inconsistent version bump is caught before
      # anything gets tagged.
      - name: Resolve target tag
        id: resolve
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            # Mirrors check-versions.sh's own [package]-scoped extraction
            # so this always agrees with what the next step validates.
            version=$(awk '
              /^\[/ { in_pkg = ($0 == "[package]") }
              in_pkg && /^version[ \t]*=/ {
                if (match($0, /"[^"]*"/)) {
                  print substr($0, RSTART + 1, RLENGTH - 2)
                  exit
                }
              }
            ' Cargo.toml)
            test -n "${version}" || { echo "::error::could not find [package] version in Cargo.toml" >&2; exit 1; }
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check version consistency & release tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: ./scripts/check-versions.sh --release "$TAG"

      # Idempotency guard keyed on the RELEASE, not the tag: a re-run after
      # a failed build (tag exists, release doesn't) must still publish, and
      # an ordinary main push that isn't a version bump (tag and release
      # both already exist) must no-op quickly. Distinguishes "release not
      # found" (404) from any other API failure — a transient error must
      # not be treated as "safe to release" (no implicit fallback).
      - name: Check for existing release
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if err=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1 >/dev/null); then
            echo "Release ${TAG} already exists; nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif echo "$err" | grep -q "HTTP 404"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::failed to check whether release ${TAG} exists" >&2
            echo "$err" >&2
            exit 1
          fi

      # Only the main-push path creates a tag; a tag-push run's tag is what
      # triggered it. Skips if the tag already exists (a re-run after a
      # failed build downstream, or a manual tag pushed ahead of this run)
      # — the release guard above, not tag existence, decides whether the
      # rest of the pipeline runs. Created via the API (not `git tag` +
      # `git push`) so this job never needs a credentialed git remote;
      # persist-credentials stays false on the checkout above.
      - name: Create release tag
        if: github.ref_type == 'branch' && steps.guard.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if err=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1 >/dev/null); then
            echo "Tag ${TAG} already exists; skipping creation."
          elif echo "$err" | grep -q "HTTP 404"; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
            echo "Created tag ${TAG} on ${GITHUB_SHA}"
          else
            echo "::error::failed to check whether tag ${TAG} exists" >&2
            echo "$err" >&2
            exit 1
          fi

  validate:
    name: Validate
    needs: preflight
    if: success() && needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check version consistency & release tag
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: ./scripts/check-versions.sh --release "$TAG"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Run quality gate
        run: make ci

  build:
    name: Build ${{ matrix.target }}
    needs: [preflight, validate]
    if: success() && needs.preflight.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: typemux-cc-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: typemux-cc-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: typemux-cc-linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/typemux-cc ${{ matrix.binary_name }}
          chmod +x ${{ matrix.binary_name }}

      - name: Generate checksum
        run: shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256

      # Upload as a build artifact instead of attaching to a release directly:
      # the release itself is only ever created once, by `publish`, after
      # every matrix leg here has succeeded.
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.binary_name }}
          path: |
            ${{ matrix.binary_name }}
            ${{ matrix.binary_name }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: [preflight, build]
    if: success() && needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      # Fail loudly if a platform's binary or checksum is missing, instead of
      # letting the glob below silently publish a partial release.
      - name: Verify release assets
        run: |
          test "$(find artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6
          test -f artifacts/typemux-cc-macos-arm64
          test -f artifacts/typemux-cc-macos-arm64.sha256
          test -f artifacts/typemux-cc-linux-x86_64
          test -f artifacts/typemux-cc-linux-x86_64.sha256
          test -f artifacts/typemux-cc-linux-arm64
          test -f artifacts/typemux-cc-linux-arm64.sha256

      # `gh release create` is atomic by design: it creates a draft release,
      # uploads every asset, and only publishes once every upload succeeds —
      # so a failed upload never leaves a partial release public. This
      # replaces the third-party softprops/action-gh-release action with the
      # `gh` CLI already preinstalled on GitHub-hosted runners.
      # `--verify-tag` stops `gh` from auto-creating a tag on the default
      # branch if the tag `preflight` created (or the tag that triggered
      # this run) is somehow not found on the remote.
      - name: Create GitHub release with all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes
